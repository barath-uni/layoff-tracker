# Hourly: fetch sources -> rebuild consensus -> build static site -> deploy to Cloudflare Pages.
# The SQLite DB and HTTP cache (data/) persist between runs through the Actions cache.
# Setup (once): repo secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, LR_CONTACT;
# repo variables CF_PAGES_PROJECT, SITE_URL, LR_BRAND (optional).
name: refresh

on:
  schedule:
    - cron: "17 * * * *"        # hourly
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-scan Google News for the whole year (slow, ~4 min extra)"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow==10.4.0

      - name: Restore data (DB + HTTP cache)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-data-${{ github.run_id }}
          restore-keys: radar-data-

      - name: Fetch, process, build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          LR_BRAND: ${{ vars.LR_BRAND }}
          LR_CONTACT: ${{ secrets.LR_CONTACT }}
          LR_BACKFILL: ${{ inputs.backfill && '1' || 'auto' }}
        run: python -m radar all

      - name: Save data
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data
          key: radar-data-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true
