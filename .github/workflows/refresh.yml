# Hourly: fetch sources -> rebuild consensus -> build static site -> force-push one commit to the `site` branch,
# which Vercel deploys (Git integration). The SQLite DB and HTTP cache (data/) persist through the Actions cache.
# `site` is the default branch, so this file is copied there on every run (scheduled runs use the default branch's copy);
# the code itself always comes from `main`.
# Optional repo settings: variable SITE_URL, secret LR_CONTACT (SEC User-Agent contact), secret SITE_DEPLOY_KEY
# (write deploy key, needed because a GITHUB_TOKEN push may not create workflow files).
name: refresh

on:
  schedule:
    - cron: "17 * * * *"        # hourly
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-scan Google News for the whole window (slow)"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow==10.4.0

      - name: Restore data (DB + HTTP cache)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-data-${{ github.run_id }}
          restore-keys: radar-data-

      - name: Fetch, process, build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://layoff-tracker.vercel.app' }}
          LR_BRAND: Layoff Tracker
          LR_CONTACT: ${{ secrets.LR_CONTACT || 'https://github.com/barath-uni/layoff-tracker' }}
          LR_DAILY: edgar                # SEC EDGAR at most once a day; every other source hourly
          LR_BACKFILL: ${{ inputs.backfill && '1' || 'auto' }}
        run: python -m radar all

      - name: Save data
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data
          key: radar-data-${{ github.run_id }}

      - name: Push the site branch (one orphan commit)
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(git rev-parse --short HEAD)
          deploy/assemble-site.sh "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          git init -q -b site
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Site build $(date -u +%Y-%m-%dT%H:%MZ) from main@$src"
          if [ -n "$SITE_DEPLOY_KEY" ]; then
            printf '%s\n' "$SITE_DEPLOY_KEY" > "$RUNNER_TEMP/key" && chmod 600 "$RUNNER_TEMP/key"
            GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git push -f "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:site
            rm -f "$RUNNER_TEMP/key"
          else
            git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:site
          fi
