# Hourly: fetch sources -> rebuild consensus -> build static site -> deploy to Cloudflare Pages (free plan, direct
# upload with wrangler) -> force-push the `site` branch (build snapshot). data/ (DB + HTTP cache) persists via the Actions cache.
# `site` is the default branch, so scheduled runs use the copy of this file in tag `site-base` (see deploy/push-site.sh);
# the code always comes from `main`. After editing this file on main, run `deploy/push-site.sh --new-base` locally.
# Repo settings: secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID; variable SITE_URL; optional secret LR_CONTACT.
name: refresh

on:
  schedule:
    - cron: "17 * * * *"        # hourly
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-scan Google News for the whole window (slow)"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow==10.4.0

      - name: Restore data (DB + HTTP cache)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-data-${{ github.run_id }}
          restore-keys: radar-data-

      - name: Fetch, process, build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://layoff-tracker.pages.dev' }}
          LR_BRAND: Layoff Tracker
          LR_CONTACT: ${{ secrets.LR_CONTACT || 'https://github.com/barath-uni/layoff-tracker' }}
          LR_DAILY: edgar                # SEC EDGAR at most once a day; every other source hourly
          LR_BACKFILL: ${{ inputs.backfill && '1' || 'auto' }}
        run: python -m radar all

      - name: Save data
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data
          key: radar-data-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages (dist/ + functions/)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages deploy dist --project-name=layoff-tracker --branch=main --commit-dirty=true

      - name: Push the site branch (site-base + one build commit)
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: deploy/push-site.sh
